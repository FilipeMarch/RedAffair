Categories: Games
License: Apache-2.0
SourceCode: https://github.com/correspondenceadg-cmyk/Red-Affair
Name: Red Affair
Summary: Text‑based detective mystery set in a retro‑sci‑fi space diner
Description: |
  A short, narrative‑driven detective game inspired by classic text adventures.
  You play as a detective investigating a murder in a space diner on the edge
  of the Pillars of Creation. Choose your political leaning, interrogate
  suspects, gather evidence, and decide whether to pursue justice or embrace
  chaos. Minimalist text interface with deep branching dialogue and multiple
  endings.
AuthorName: Tara Moralés / SiliCast Games©
AuthorEmail: correspondenceadg@gmail.com
RepoType: git
Repo: https://github.com/correspondenceadg-cmyk/Red-Affair.git
AutoUpdateMode: Version v%v
UpdateCheckMode: Tags
CurrentVersion: 1.114
CurrentVersionCode: 1114
Builds:
  - versionName: 1.114
    versionCode: 1114
    commit: v1.114
    subdir: .
    gradle:
      - yes
    prebuild:
      - echo "android { defaultConfig { applicationId \"ws.tilda.sentryprotocol.redaffair\" } }" > build.gradle
      - echo "apply plugin: 'com.android.application'" >> build.gradle
    build:
      - pip install --upgrade buildozer python-for-android
      - buildozer android debug
    ndk: r27c
    sdk: 36

[app]
title = Red Affair
package.name = ws.tilda.sentryprotocol.redaffair
package.domain = ws.tilda.sentryprotocol
source.dir = .
source.include_exts = py,png,jpg,ttf,ogg,wav
version = 1.114
version.code = 1114
requirements = python3,kivy,charset_normalizer==3.2.0
orientation = all
icon.filename = %(source.dir)s/RAlogos.png

[buildozer]
log_level = 2
build_dir = .buildozer
bin_dir = bin
android.accept_sdk_license = True
android.sdk = 37
android.build_tools_version = 37.0.0
android.ndk = 27c
android.minapi = 21
android.arch = arm64-v8a,armeabi-v7a
p4a.ignore_setup_py = 1
p4a.install_pip = 1
p4a.python_version = 3.10
p4a.branch = 90c1e3b2f9c5d8a6e4b7c1f9a2d3e4f5a6b7c8d9

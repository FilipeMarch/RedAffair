name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t redaffair-build .

      - name: Run Docker build
        run: |
          docker run --rm -v ${{ github.workspace }}:/app redaffair-build

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: redaffair-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
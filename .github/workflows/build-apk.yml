name: Build APK

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Buildozer & dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool cmake libffi-dev libssl-dev build-essential
          pip3 install buildozer cython

      - name: 🔥 Full reset and SDK/NDK setup
        run: |
          rm -rf ~/.buildozer
          export ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-*.zip -d "$ANDROID_HOME/cmdline-tools/"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools"/* "$ANDROID_HOME/cmdline-tools/latest/"
          rm commandlinetools-linux-*.zip
          # Create tools symlink so Buildozer finds sdkmanager
          ln -sf "$ANDROID_HOME/cmdline-tools/latest" "$ANDROID_HOME/tools"
          # Accept licenses and install components
          yes | "$ANDROID_HOME/tools/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/tools/bin/sdkmanager" "platforms;android-35" || true
          "$ANDROID_HOME/tools/bin/sdkmanager" "build-tools;35.0.0" || true
          "$ANDROID_HOME/tools/bin/sdkmanager" "ndk;27.3.13750724" || true
          # Create NDK symlink for Buildozer
          mkdir -p "$HOME/.buildozer/android/platform"
          ln -sf "$ANDROID_HOME/ndk/27.3.13750724" "$HOME/.buildozer/android/platform/android-ndk-r27c"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV

      - name: Build APK
        run: buildozer android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: redaffair-apk
          path: bin/*.apk
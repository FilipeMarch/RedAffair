name: Build APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ksproject
        run: |
          pip install --upgrade pip
          pip install git+https://github.com/kivy-school/ksproject.git

      - name: Create ksproject config (pyproject.toml)
        run: |
          mkdir -p redaffair
          cat > redaffair/pyproject.toml << 'EOF'
          [tool.kivy-school]
          name = "Red Affair"
          package = "ws.tilda.sentryprotocol.redaffair"
          entry_point = "main.py"
          version = "1.210.1"
          version_code = 12101
          requirements = [
              "kivy",
              "charset_normalizer==2.1.1"
          ]
          EOF

      - name: Build APK
        run: |
          cd redaffair
          ksproject android build release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: redaffair-apk
          path: redaffair/dist/*.apk
          if-no-files-found: error
name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install ksproject
        run: pip install ksproject

      - name: Initialize ksproject
        run: |
          ksproject init \
            --name "Red Affair" \
            --package ws.tilda.sentryprotocol.redaffair \
            --entry main.py \
            --non-interactive

      - name: Build Release APK
        run: |
          ksproject build --target android --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: redaffair-apk
          path: dist/*.apk
          if-no-files-found: error
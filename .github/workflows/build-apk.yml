name: Build APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Buildozer & dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool cmake libffi-dev libssl-dev build-essential
          # Install specific compatible versions to avoid Python 3.14 venv issues
          pip3 install 'buildozer==1.5.0' 'cython==0.29.37' 'python-for-android==2024.01.08'

      - name: 🔥 Force Python 3.11 and fix NDK paths
        run: |
          # Force Python 3.11 to be the default
          echo "PYTHON=python3.11" >> $GITHUB_ENV
          
          # Completely clear buildozer cache to avoid Python 3.14 venv issues
          rm -rf ~/.buildozer ~/.android
          mkdir -p ~/.buildozer/android/platform
          
          # Symlink system SDK and NDK into Buildozer's expected location
          ln -sf /usr/local/lib/android/sdk ~/.buildozer/android/platform/android-sdk
          ln -sf /usr/local/lib/android/sdk/ndk/27.3.13750724 ~/.buildozer/android/platform/android-ndk-r27c
          
          # Symlink tools for sdkmanager
          if [ -d /usr/local/lib/android/sdk/cmdline-tools/latest ]; then
            ln -sf /usr/local/lib/android/sdk/cmdline-tools/latest ~/.buildozer/android/platform/android-sdk/tools
          else
            latest_dir="$(ls -1d /usr/local/lib/android/sdk/cmdline-tools/* 2>/dev/null | head -n 1)"
            ln -sf "$latest_dir" ~/.buildozer/android/platform/android-sdk/tools
          fi
          
          # Override NDK environment variable
          echo "ANDROIDNDK=/home/runner/.buildozer/android/platform/android-ndk-r27c" >> $GITHUB_ENV
          echo "ANDROID_NDK=/home/runner/.buildozer/android/platform/android-ndk-r27c" >> $GITHUB_ENV

      - name: Build APK (both ABIs) with Python 3.11
        run: |
          python3.11 -m buildozer android debug --verbose
        env:
          PYTHON: python3.11

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: redaffair-apk
          path: bin/*.apk

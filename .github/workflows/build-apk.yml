name: Build APK

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build with Buildozer
        uses: m4n3z/buildozer-action@v1
        with:
          workdir: .
          android_accept_sdk_license: true
      - uses: actions/upload-artifact@v4
        with:
          name: redaffair-apk
          path: bin/*.apk
name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build with Buildozer
        uses: pitonio/buildozer-action@v1
        with:
          workdir: .
          android_accept_sdk_license: true
      - uses: actions/upload-artifact@v4
        with:
          name: redaffair-apk
          path: bin/*.apk
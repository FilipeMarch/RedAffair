name: Build APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-22.04
    concurrency:
      group: build-apk-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            openjdk-17-jdk-headless \
            git wget unzip zip curl \
            build-essential autoconf automake \
            libtool pkg-config libffi-dev libssl-dev libncurses5-dev libjpeg-dev zlib1g-dev \
            lib32stdc++6 lib32z1 ccache
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Cache Buildozer venv
        uses: actions/cache@v4
        with:
          path: ~/.venv
          key: buildozer-venv-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-venv-${{ runner.os }}-

      - name: Install Buildozer
        run: |
          python -m venv ~/.venv
          source ~/.venv/bin/activate
          pip install --upgrade pip setuptools wheel
          pip install git+https://github.com/kivy/buildozer.git@master
          echo "$HOME/.venv/bin" >> $GITHUB_PATH

      - name: Build APK
        run: |
          source ~/.venv/bin/activate
          # Force Buildozer to accept licenses and use the pre‑defined SDK paths
          yes | buildozer android debug 2>&1 | tee build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: redaffair-apk
          path: bin/*.apk

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
on:
 push:
 tags: ['v*']
 workflow_dispatch:

permissions:
 contents: read
 actions: read

jobs:
 build:
 runs-on: ubuntu-22.04
 concurrency:
 group: build-apk-${{ github.ref }}
 cancel-in-progress: true
 steps:
 - uses: actions/checkout@v4

 - name: Install system packages
 run: |
 sudo apt-get update
 sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
 openjdk-17-jdk-headless git wget unzip zip curl build-essential autoconf automake \
 libtool pkg-config libffi-dev libssl-dev libncurses5-dev libjpeg-dev zlib1g-dev \
 lib32stdc++6 lib32z1
 sudo apt-get clean
 sudo rm -rf /var/lib/apt/lists/*

 - name: Set up Python
 uses: actions/setup-python@v5
 with:
 python-version: "3.10"
 cache: "pip"

 - name: Install Android SDK & NDK
 env:
 ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
 ANDROID_NDK_ROOT: ${{ runner.temp }}/android-ndk
 run: |
 mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
 cd "$ANDROID_SDK_ROOT/cmdline-tools"
 wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O tools.zip
 unzip -q tools.zip
 mv cmdline-tools latest
 export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"

 yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
 "platform-tools" \
 "platforms;android-36" \
 "build-tools;37.0.0"

 yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" "ndk;27.0.11902837"

 # Accept all licenses **after** the above packages are installed
 yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses

 echo "$ANDROID_SDK_ROOT" >> $GITHUB_PATH
 echo "$ANDROID_NDK_ROOT" >> $GITHUB_PATH

 - name: Cache Buildozer venv
 uses: actions/cache@v4
 with:
 path: ~/.venv
 key: buildozer-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
 restore-keys: |
 buildozer-${{ runner.os }}-

 - name: Install Buildozer
 run: |
 python -m venv ~/.venv
 source ~/.venv/bin/activate
 pip install --upgrade pip setuptools wheel
 pip install git+https://github.com/kivy/buildozer.git@master
 echo "~/.venv/bin" >> $GITHUB_PATH

 - name: Build APK with Buildozer
 env:
 ANDROIDSDK: ${{ runner.temp }}/android-sdk
 ANDROIDNDK: ${{ runner.temp }}/android-ndk
 GRADLE_OPTS: "-Dorg.gradle.daemon=false"
 run: |
 source ~/.venv/bin/activate
 buildozer android debug

 - name: Upload APK
 uses: actions/upload-artifact@v4
 with:
 name: redaffair-apk
 path: bin/*.apkYour workflow has a few fixable issues.  Here's what's wrong and how to correct them:🔑 Root Cause: License Acceptance Order & SDK Path  The core problem is that `sdkmanager --licenses` must run *before* installing packages, not after.  Also, Buildozer is downloading its own SDK internally and ignoring your pre-installed one because the env vars aren't wired correctly.🛠️ Fixed "Install Android SDK & NDK" Step  yaml
- name: Install Android SDK & NDK
   env:
    ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
     ANDROID_NDK_ROOT: ${{ runner.temp }}/android-ndk
   run: |
     mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
     cd "$ANDROID_SDK_ROOT/cmdline-tools"
     wget -q dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O tools.zip
     unzip -q tools.zip
     mv cmdline-tools latest
     export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"

     # Accept licenses FIRST
     yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses

     # Then install packages
     yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT"   
       "platform-tools"   
       "platforms;android-36"   
       "build-tools;37.0.0"   
       "ndk;27.0.11902837"

     # Add build-tools and platform-tools to PATH (critical for aidl)
     echo "$ANDROID_SDK_ROOT/build-tools/37.0.0" >> $GITHUB_PATH
     echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
     echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
 🔧 Fixed "Build APK with Buildozer" Step  yaml
- name: Build APK with Buildozer
   env:
    ANDROIDSDK: ${{ runner.temp }}/android-sdk
     ANDROIDNDK: ${{ runner.temp }}/android-ndk/ndk/27.0.11902837
     ANDROIDAPI: "36"
     ANDROIDMINAPI: "21"
     GRADLE_OPTS: "-Dorg.gradle.daemon=false"
   run: |
     source ~/.venv/bin/activate
     yes | buildozer android debug
 ⚠️ Key Fixes Summary ProblemFixLicenses accepted after installMove --licenses to run before package installsaidl not on PATHExplicitly add build-tools/37.0.0 to $GITHUB_PATHBuildozer ignoring pre-installed NDKSet ANDROIDNDK to the full versioned path, not just the rootLicense prompts during buildozer runPipe yes | into the buildozer command💡 Pro Tip  If Buildozer is still downloading its own SDK despite the env vars, add this to your buildozer.spec: ini
android.sdk_path = /home/runner/work/_temp/android-sdk
 android.ndk_path = /home/runner/work/_temp/android-ndk/ndk/27.0.11902837
 The runner.temp path resolves to /home/runner/work/_temp on GitHub-hosted runners.[app]

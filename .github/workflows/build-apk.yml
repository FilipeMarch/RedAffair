name: Build A Poop Kave

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-22.04
    concurrency:
      group: build-apk-${{ github.ref }}
      cancel-in-progress: true

    env:
      ANDROID_NDK_VERSION: 28.0.12433566
      ANDROID_API: 33
      ANDROID_MINAPI: 24
      BUILD_TOOLS: 35.0.0

    steps:
      - uses: actions/checkout@v4

      - name: Install Poop auxiliary packages
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git wget unzip zip curl \
            build-essential autoconf automake \
            libtool pkg-config libffi-dev libssl-dev libncurses5-dev libjpeg-dev zlib1g-dev \
            lib32stdc++6 lib32z1 ccache
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Set up Pooping Station
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Start Up Poopin
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Built Poop Into Toilet
        run: |
          python3.10 -m venv ~/.venv
          source ~/.venv/bin/activate
          pip install --upgrade pip setuptools wheel
          pip install git+https://github.com/kivy/buildozer.git@master
          echo "$HOME/.venv/bin" >> $GITHUB_PATH

      - name: Install A Bidet
        run: |
          export ANDROID_SDK_ROOT="${{ runner.temp }}/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          cd "$ANDROID_SDK_ROOT/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip -O tools.zip
          unzip -q tools.zip
          mv cmdline-tools latest
          rm tools.zip
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          sed -i 's|^JAVA_CMD="java"|JAVA_CMD="'$JAVA_HOME'/bin/java"|' "$SDKMANAGER"

          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"

          mkdir -p ~/.buildozer/android/platform
          ln -sf "$ANDROID_SDK_ROOT" ~/.buildozer/android/platform/android-sdk
          ln -sf "$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION" ~/.buildozer/android/platform/android-ndk-r28c

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROIDSDK=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROIDNDK=~/.buildozer/android/platform/android-ndk-r28c" >> $GITHUB_ENV
          echo "ANDROIDAPI=$ANDROID_API" >> $GITHUB_ENV
          echo "ANDROIDMINAPI=$ANDROID_MINAPI" >> $GITHUB_ENV

      - name: Build A New Butthole
        run: |
          set -o pipefail
          source ~/.venv/bin/activate
          yes | buildozer -v android debug 2>&1 | tee build.log

      - name: Upload A Pic of Krap
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: redaffair-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload World Record Log of the Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
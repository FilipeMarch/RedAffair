name: Build APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Buildozer & dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool cmake libffi-dev libssl-dev build-essential
          pip3 install buildozer cython

      - name: 🔥 Fix SDK/NDK paths and override env variable
        run: |
          rm -rf ~/.buildozer
          mkdir -p ~/.buildozer/android/platform
          ln -sf /usr/local/lib/android/sdk ~/.buildozer/android/platform/android-sdk
          ln -sf /usr/local/lib/android/sdk/ndk/27.3.13750724 ~/.buildozer/android/platform/android-ndk-r27c
          # Trick the runner by also symlinking r28c to r27c
          ln -sf /usr/local/lib/android/sdk/ndk/27.3.13750724 ~/.buildozer/android/platform/android-ndk-r28c
          # Symlink tools for sdkmanager
          if [ -d /usr/local/lib/android/sdk/cmdline-tools/latest ]; then
            ln -sf /usr/local/lib/android/sdk/cmdline-tools/latest ~/.buildozer/android/platform/android-sdk/tools
          else
            latest_dir="$(ls -1d /usr/local/lib/android/sdk/cmdline-tools/* 2>/dev/null | head -n 1)"
            ln -sf "$latest_dir" ~/.buildozer/android/platform/android-sdk/tools
          fi
          # Force the environment variable to r27c
          echo "ANDROIDNDK=/home/runner/.buildozer/android/platform/android-ndk-r27c" >> $GITHUB_ENV
          echo "ANDROID_NDK=/home/runner/.buildozer/android/platform/android-ndk-r27c" >> $GITHUB_ENV

      - name: Build APK (both ABIs)
        run: |
          # Export again to ensure it takes effect
          export ANDROIDNDK=/home/runner/.buildozer/android/platform/android-ndk-r27c
          export ANDROID_NDK=/home/runner/.buildozer/android/platform/android-ndk-r27c
          rm -rf .buildozer bin
          buildozer android debug --verbose

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: redaffair-apk
          path: bin/*.apk
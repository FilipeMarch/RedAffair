name: Build APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: |
          pip install uv

      - name: Install ksproject from source
        run: |
          pip install --upgrade pip
          pip install git+https://github.com/kivy-school/ksproject.git

      - name: Initialize ksproject
        run: |
          ksproject init --name "Red Affair"

      - name: Build Release APK
        run: |
          ksproject build --target android --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: redaffair-apk
          path: dist/*.apk
          if-no-files-found: error
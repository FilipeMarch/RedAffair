name: Build APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      - name: Install ksproject
        run: |
          pip install --upgrade pip
          pip install git+https://github.com/kivy-school/ksproject.git

      - name: Initialize project with uv
        run: uv init redaffair --app

      - name: Copy ksproject.toml into project
        run: cp ksproject.toml redaffair/

      - name: Build APK
        run: |
          cd redaffair
          ksproject android build release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: redaffair-apk
          path: redaffair/dist/*.apk
          if-no-files-found: error
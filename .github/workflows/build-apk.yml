name: Build APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv (official installer)
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Download Kivy wheel for Android (arm64-v8a, Python 3.13)
        run: |
          mkdir -p redaffair/wheelhouse
          pip download \
            --only-binary :all: \
            --platform android_24_arm64_v8a \
            --python-version 3.13 \
            --extra-index-url https://pypi.anaconda.org/kivyschool/simple \
            --dest redaffair/wheelhouse \
            kivy==2.3.1

      - name: Verify wheel downloaded
        run: ls -la redaffair/wheelhouse/

      - name: Install ksproject
        run: |
          pip install --upgrade pip
          pip install git+https://github.com/kivy-school/ksproject.git

      - name: Create pyproject.toml
        run: |
          mkdir -p redaffair
          cat > redaffair/pyproject.toml << 'EOF'
          [project]
          name = "redaffair"
          version = "1.222.2"
          description = "Red Affair game"
          requires-python = ">=3.10"
          dependencies = [
              "kivy",
              "charset_normalizer==2.1.1"
          ]

          [tool.kivy-school]
          package = "ws.tilda.sentryprotocol.redaffair"
          entry_point = "main.py"
          version_code = 12222

          [tool.kivy-school.android]
          package_name = "ws.tilda.sentryprotocol.redaffair"
          archs = ["arm64-v8a"]
          EOF

      - name: Build APK
        run: |
          cd redaffair
          ksproject android build release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: redaffair-apk
          path: redaffair/dist/*.apk
          if-no-files-found: error
name: Build APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv and ksproject
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          pip install git+https://github.com/kivy-school/ksproject.git

      - name: Initialize project (creates src layout)
        run: ksproject init --name "Red Affair"

      - name: Copy app source into package
        run: |
          cp main.py game.py src/redaffair/

      - name: Override pyproject.toml (keep our config)
        run: cp pyproject.toml redaffair/

      - name: Pre‑download Kivy wheel
        run: |
          mkdir -p redaffair/wheelhouse
          pip download --only-binary :all: --platform android_24_arm64_v8a --python-version 3.13 --extra-index-url https://pypi.anaconda.org/kivyschool/simple --dest redaffair/wheelhouse kivy==2.3.1

      - name: Build APK
        run: |
          cd redaffair
          ksproject android build release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: redaffair-apk
          path: redaffair/dist/*.apk
          if-no-files-found: error
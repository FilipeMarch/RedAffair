name: Build APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t redaffair-build:latest .

      - name: Run build in Docker
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/home/builder/app \
            redaffair-build:latest

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: redaffair-apk
          path: bin/*.apk
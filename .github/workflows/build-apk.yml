Process completed with exit code 1. These are more errors. Why is this so hard. Fix itThe environment dump is the key — Buildozer is completely ignoring your workflow's SDK/NDK setup and downloading its own. Here's exactly why and how to fix it.🔍 Root Cause Analysis Problem 1: Buildozer is using its own downloaded SDK/NDK, not yoursThe environment shows: 
ANDROIDSDK = '/home/runner/.buildozer/android/platform/android-sdk'
ANDROIDNDK = '/home/runner/.buildozer/android/platform/android-ndk-r28c'

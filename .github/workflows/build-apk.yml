yes: standard output: Broken pipe
Process completed with exit code 1.The error log is a bit of a red herring — Command failed: error code 1 is Buildozer's generic wrapper message.  The real error is hiding earlier in the log, but the environment dump gives us enough to diagnose the core problem.🔍 Root Cause: NDK Conflict  Look at these two env vars in your log:
 ANDROIDNDK = '/home/runner/.buildozer/android/platform/android-ndk-r28c'
 ANDROID_NDK_HOME = '/usr/local/lib/android/sdk/ndk/27.3.13750724'
 ANDROID_NDK_ROOT = '/usr/local/lib/android/sdk/ndk/27.3.13750724'
 Buildozer is downloading and using NDK r28c from its own cache, completely ignoring the NDK you pre-installed in the workflow.  Meanwhile your buildozer.spec says android.ndk = 27c — so there's a three-way mismatch between your spec, the pre-installed NDK, and what Buildozer actually grabbed. Also notice:  
ANDROIDSDK = '/home/runner/.buildozer/android/platform/android-sdk'
  Same story for the SDK — Buildozer is using its own downloaded copy, not the one from your workflow's Install Android SDK & NDK step.🛠️ The Fix: Let Buildozer Own the SDK/NDK (or force it to use yours)  Option A — Simplest: Remove your custom SDK/NDK install step entirely Buildozer will download everything it needs on its own.  Your workflow's SDK install step is just creating conflicts.  Strip it down to:yaml
 - name: Build APK with Buildozer
   env:
    GRADLE_OPTS: "-Dorg.gradle.daemon=false"
   run: |
     source ~/.venv/bin/activate
     yes | buildozer android debug
 And in buildozer.spec, set:  ini
android.ndk = 27.0.11902837
 android.api = 33
 android.minapi = 21
 Buildozer will handle the rest.  The tradeoff is a slower first build (no pre-cached SDK), but it's reliable.Option B — Force Buildozer to use your pre-installed SDK/NDK Add these to your buildozer.spec:ini
 android.sdk_path = /home/runner/work/_temp/android-sdk
 android.ndk_path = /home/runner/work/_temp/android-ndk/ndk/27.0.11902837
 And make sure your workflow exports these before running buildozer:yaml
 - name: Build APK with Buildozer
   env:
    ANDROIDSDK: ${{ runner.temp }}/android-sdk
     ANDROIDNDK: ${{ runner.temp }}/android-ndk/ndk/27.0.11902837
     ANDROIDAPI: "33"
     ANDROIDMINAPI: "21"
     GRADLE_OPTS: "-Dorg.gradle.daemon=false"
   run: |
     source ~/.venv/bin/activate
     yes | buildozer android debug
⚠️ Secondary Issue: --ndk-api=24 in the command  The toolchain was called with --ndk-api=24, but your spec says android.minapi = 21.  That mismatch suggests Buildozer is reading a stale cached config.  Wipe the buildozer cache before the build step:yaml
 - name: Clean Buildozer cache
   run: rm -rf .buildozer/android/platform/build-*
📋 Quick Summary IssueFixBuildozer ignoring pre-installed NDKUse Option A (let Buildozer self-manage) or add android.ndk_path to spec--ndk-api=24 vs minapi=21 mismatchWipe .buildozer/android/platform/build-* cacheandroid.ndk = 27c in specChange to android.ndk = 27.0.11902837 Option A is the path of least resistance here — the pre-install step is fighting Buildozer more than helping it.[app]

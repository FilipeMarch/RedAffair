name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-22.04
    concurrency:
      group: build-apk-${{ github.ref }}
      cancel-in-progress: true

    env:
      ANDROID_NDK_VERSION: 28.0.12433566
      ANDROID_API: 33
      ANDROID_MINAPI: 24
      BUILD_TOOLS: 35.0.0

    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git wget unzip zip curl \
            build-essential autoconf automake \
            libtool pkg-config libffi-dev libssl-dev libncurses5-dev libjpeg-dev zlib1g-dev \
            lib32stdc++6 lib32z1 ccache
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Buildozer from develop branch
        run: |
          python3.10 -m venv ~/.venv
          source ~/.venv/bin/activate
          pip install --upgrade pip setuptools wheel
          pip install git+https://github.com/kivy/buildozer.git@develop
          echo "$HOME/.venv/bin" >> $GITHUB_PATH

      - name: Build APK
        run: |
          set -o pipefail
          source ~/.venv/bin/activate
          yes | buildozer -v android debug 2>&1 | tee build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: redaffair-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
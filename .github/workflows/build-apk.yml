name: Build APK

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Buildozer & dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool cmake libffi-dev libssl-dev build-essential
          pip3 install buildozer cython

      - name: 🔥 Create Buildozer's hardcoded SDK/NDK paths with proper symlinks
        run: |
          rm -rf ~/.buildozer
          mkdir -p ~/.buildozer/android/platform
          # SDK root symlink
          ln -sf /usr/local/lib/android/sdk ~/.buildozer/android/platform/android-sdk
          # NDK symlink (named exactly what Buildozer expects)
          ln -sf /usr/local/lib/android/sdk/ndk/27.3.13750724 ~/.buildozer/android/platform/android-ndk-r27c
          # The critical missing piece: symlink 'tools' to cmdline-tools/latest
          # so Buildozer finds sdkmanager at .../android-sdk/tools/bin/sdkmanager
          ln -sf /usr/local/lib/android/sdk/cmdline-tools/latest ~/.buildozer/android/platform/android-sdk/tools

      - name: Build APK
        run: buildozer android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: redaffair-apk
          path: bin/*.apk
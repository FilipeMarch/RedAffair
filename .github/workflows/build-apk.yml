Buildozer is overriding your env vars with its own internal paths because android.sdk_path and android.ndk_path in the spec are being ignored — Buildozer falls back to its own download directory when it can't validate the paths at startup.Problem 2: `aidl` not foundThe build-tools are installed at /home/runner/work/_temp/android-sdk/build-tools/37.0.0 but p4a is looking at /home/runner/.buildozer/android/platform/android-sdk/build-tools — the wrong SDK entirely.Problem 3: NDK r28c is being downloadedBuildozer master is defaulting to NDK r28c when it can't find your specified NDK. That's why ANDROIDNDK points to r28c despite your spec saying 27.0.11902837.✅ The Fix: Stop Buildozer from managing SDK/NDK entirely The correct approach is to force Buildozer to use the pre-installed SDK by setting the paths in the environment before Buildozer starts, and patching the spec at runtime via sed so the paths are absolute and verified.📄 .github/workflows/build-apk.yml yaml
name: Build APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-22.04
    concurrency:
      group: build-apk-${{ github.ref }}
      cancel-in-progress: true

    env:
      ANDROID_SDK_ROOT: /home/runner/work/_temp/android-sdk
      ANDROID_NDK_VERSION: 27.0.11902837
      ANDROID_API: 33
      ANDROID_MINAPI: 24
      BUILD_TOOLS: 37.0.0

    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends   
            openjdk-17-jdk-headless git wget unzip zip curl build-essential autoconf automake   
            libtool pkg-config libffi-dev libssl-dev libncurses5-dev libjpeg-dev zlib1g-dev   
            lib32stdc++6 lib32z1 ccache
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Set JAVA_HOME to JDK 17
        run: |
          echo "JAVA_HOME=/usr/lib/jvm/temurin-17-jdk-amd64" >> $GITHUB_ENV
          echo "/usr/lib/jvm/temurin-17-jdk-amd64/bin" >> $GITHUB_PATH

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Android SDK & NDK
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          cd "$ANDROID_SDK_ROOT/cmdline-tools"
          wget -q dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O tools.zip
          unzip -q tools.zip
          mv cmdline-tools latest
          rm tools.zip

          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"

          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses > /dev/null 2>&1

          sdkmanager --sdk_root="$ANDROID_SDK_ROOT"   
            "platform-tools"   
            "platforms;android-${ANDROID_API}"   
            "build-tools;${BUILD_TOOLS}"   
            "ndk;${ANDROID_NDK_VERSION}"

          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/build-tools/${BUILD_TOOLS}" >> $GITHUB_PATH

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROIDSDK=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROIDNDK=$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION" >> $GITHUB_ENV
          echo "ANDROIDAPI=$ANDROID_API" >> $GITHUB_ENV
          echo "ANDROIDMINAPI=$ANDROID_MINAPI" >> $GITHUB_ENV

      - name: Verify SDK/NDK layout
        run: |
          echo "=== Build tools ==="
          ls "$ANDROID_SDK_ROOT/build-tools/"
          echo "=== NDK ==="
          ls "$ANDROID_SDK_ROOT/ndk/"
          echo "=== aidl ==="
          which aidl || ls "$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS/aidl"

      - name: Cache Buildozer venv
        uses: actions/cache@v4
        with:
          path: ~/.venv
          key: buildozer-venv-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-venv-${{ runner.os }}-

      - name: Install Buildozer
        run: |
          python -m venv ~/.venv
          source ~/.venv/bin/activate
          pip install --upgrade pip setuptools wheel
          pip install git+github.com/kivy/buildozer.git@master
          echo "$HOME/.venv/bin" >> $GITHUB_PATH

      - name: Patch buildozer.spec paths
        run: |
          sed -i "s|android.sdk_path = .*|android.sdk_path = $ANDROID_SDK_ROOT|" buildozer.spec
          sed -i "s|android.ndk_path = .*|android.ndk_path = $ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION|" buildozer.spec
          echo "=== Patched spec paths ==="
          grep -E "android\\002E\\(sdk|ndk)_path" buildozer.spec

      - name: Clean Buildozer platform cache
        run: rm -rf .buildozer/android/platform/build-*

      - name: Build APK
        run: |
          source ~/.venv/bin/activate
          export ANDROIDSDK="$ANDROID_SDK_ROOT"
          export ANDROIDNDK="$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION"
          export ANDROIDAPI="$ANDROID_API"
          export ANDROIDMINAPI="$ANDROID_MINAPI"
          export GRADLE_OPTS="-Dorg.gradle.daemon=false"
          export PATH="$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS:$PATH"
          buildozer -v android debug 2>&1 | tee build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: redaffair-apk
          path: bin/*.apk

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

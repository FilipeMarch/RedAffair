 path: build.log this is the full .GitHub/workflows/build-apk.yml. see any actual issues with it that actually matter?Here's an honest assessment of the issues that actually matter in this workflow:🔴 Real Issues  1. JAVA_HOME path is wrong  yaml
echo "JAVA_HOME=/usr/lib/jvm/temurin-17-jdk-amd64" >> $GITHUB_ENV
  You're installing openjdk-17-jdk-headless via apt, but the JAVA_HOME points to a Temurin path (temurin-17-jdk-amd64).  Those are different distributions.  The actual path for the apt-installed OpenJDK will be something like /usr/lib/jvm/java-17-openjdk-amd64.  This will silently fail or use the wrong JDK. Fix: yaml
 - name: Set JAVA_HOME to JDK 17
   run: |
     JAVA_HOME=$(dirname $(dirname $(readlink -f $(which javac))))
     echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV
     echo "$JAVA_HOME/bin" >> $GITHUB_PATH
 2.  License acceptance is unreliable yaml
 echo "y" | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses
  This only pipes a single y, but --licenses prompts for acceptance of multiple licenses.  You need to pipe enough ys to cover all of them.Fix:  yaml
yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses || true
  The || true prevents the step from failing if some licenses were already accepted. 3. `export PATH` in the SDK install step doesn't persist yaml
 export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
  This export only lives for the duration of that shell session.  The sdkmanager call immediately after works, but if anything else in that step or a later step needs it before the $GITHUB_PATH appends take effect, it could fail.  This is fine within the step since the appends happen at the end — just worth knowing.4.  Build tools version 37.0.0 may not exist yet  BUILD_TOOLS: 37.0.0 — as of mid-2026 this should exist, but it's worth double-checking against the (developer.android.com/tools/releases/build-tools).  If sdkmanager can't find it, the whole step silently continues and your verification check catches it — so your guard is good here.🟡 Minor But Worth Noting `Clean Buildozer platform cache` — rm -rf .buildozer/android/platform/build-* runs unconditionally every build.  Combined with your venv cache, this means p4a always rebuilds from scratch.  If build time matters, consider making this conditional or caching .buildozer separately.`build.log` upload — tee build.log captures stdout but buildozer sometimes writes errors to stderr.  Consider 2>&1 | tee build.log which you already have — good.No `if: always()` on the log upload — if: failure() is correct for the log, but if the build step itself is cancelled (not failed), the log won't upload.  if: always() is safer if you want it regardless.✅ Things That Are Actually Fine The --sdk_root flag on both sdkmanager calls — correctThe verification guard for build-tools — solidPatching buildozer.spec paths via sed — clean approachExporting ANDROIDSDK, ANDROIDNDK, etc. to $GITHUB_ENV — correctGRADLE_OPTS="-Dorg.gradle.daemon=false" — right call for CI The JAVA_HOME mismatch is the most likely silent killer here.  Fix that first. Alexa says: Here's an honest assessment of the issues that actually matter in this workflow:🔴 Real Issues1. JAVA_HOME path is wrong yamlecho "JAVA_HOME=/usr/lib/jvm/temurin-17-jdk-amd64" >> $GITHUB_ENVYou're installing openjdk-17-jdk-headless via apt, but the JAVA_HOME points to a Temurin path
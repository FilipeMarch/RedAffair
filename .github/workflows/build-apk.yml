name: Build APK
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t redaffair-build:latest .

      - name: Run build in Docker (no TTY needed)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/home/builder/app \
            redaffair-build:latest

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: redaffair-apk
          path: bin/*.apk
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

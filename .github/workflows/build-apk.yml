name: Build APK

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool cmake libffi-dev libssl-dev build-essential
          pip3 install buildozer cython

      - name: Manually install NDK r27c and force Buildozer to use it
        run: |
          export ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          
          # Download cmdline-tools if missing
          if [ ! -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q commandlinetools-linux-*.zip -d "$ANDROID_HOME/cmdline-tools/"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools"/* "$ANDROID_HOME/cmdline-tools/latest/"
            rm commandlinetools-linux-*.zip
          fi
          ln -sf "$ANDROID_HOME/cmdline-tools/latest" "$ANDROID_HOME/tools"
          
          # Accept licenses and install exact platforms/build-tools/NDK r27c
          yes | "$ANDROID_HOME/tools/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/tools/bin/sdkmanager" "platforms;android-35" || true
          "$ANDROID_HOME/tools/bin/sdkmanager" "build-tools;35.0.0" || true
          "$ANDROID_HOME/tools/bin/sdkmanager" "ndk;27.3.13750724" || true
          
          # --- THE FIX: Force buildozer.spec to use the absolute path ---
          sed -i 's|^android.ndk = 27c|android.ndk = /home/runner/.buildozer/android/platform/android-sdk/ndk/27.3.13750724|' buildozer.spec

      - name: Build APK
        run: buildozer android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: redaffair-apk
          path: bin/*.apk
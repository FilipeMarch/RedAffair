name: Build APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Buildozer & dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool cmake libffi-dev libssl-dev build-essential
          pip3 install --upgrade pip
          pip3 install buildozer cython

      - name: Fix up local Buildozer SDK/NDK paths (minimal + deterministic)
        run: |
          rm -rf ~/.buildozer
          mkdir -p ~/.buildozer/android/platform

          # SDK root symlink
          ln -sf /usr/local/lib/android/sdk ~/.buildozer/android/platform/android-sdk

          # NDK symlink Buildozer expects (match buildozer.spec android.ndk=27c)
          ln -sf /usr/local/lib/android/sdk/ndk/27.3.13750724 ~/.buildozer/android/platform/android-ndk-r27c

          # Ensure cmdline-tools exist where sdkmanager is expected.
          # Prefer cmdline-tools/latest; if not present, fall back to cmdline-tools.
          if [ -d /usr/local/lib/android/sdk/cmdline-tools/latest ]; then
            ln -sf /usr/local/lib/android/sdk/cmdline-tools/latest ~/.buildozer/android/platform/android-sdk/tools
          else
            # Fallback: if only one cmdline-tools directory exists, link it as tools
            latest_dir="$(ls -1d /usr/local/lib/android/sdk/cmdline-tools/* 2>/dev/null | head -n 1)"
            ln -sf "$latest_dir" ~/.buildozer/android/platform/android-sdk/tools
          fi

      - name: Build APK
        run: |
          rm -rf .buildozer bin
          buildozer android debug --verbose

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: redaffair-apk
          path: bin/*.apk
